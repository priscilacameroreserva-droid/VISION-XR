<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080d16"><title>VXR · Vision XR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d16;color:#f5f7fb;font-family:Inter,system-ui,Arial}#world{position:fixed;inset:0;width:100%;height:100%;display:block}#welcome{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#243b50,#0a1220 65%,#05080e)}.card{width:min(540px,92vw);padding:28px 22px;text-align:center;border:1px solid #9ad9df66;border-radius:24px;background:#101b2beF;box-shadow:0 15px 70px #0009}.logo{font-size:clamp(48px,12vw,82px);font-weight:950;letter-spacing:.15em;color:#eafcff;text-shadow:0 0 25px #64e6ed}.sub{letter-spacing:.22em;color:#a9c8d0;font-size:11px;margin:5px 0 25px}button{font:inherit;color:#fff;border:1px solid #ffffff38;background:linear-gradient(145deg,#24374b,#111d2d);border-radius:13px;padding:12px 15px}button:active{border-color:#7de9ed}#enter{font-size:18px;font-weight:800;padding:15px 52px;border-radius:99px;background:linear-gradient(110deg,#246b70,#455f8d)}.note{font-size:12px;color:#a9bac8;line-height:1.55;margin-top:17px}#status{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;padding:8px 13px;background:#091421c9;border:1px solid #8adce344;border-radius:30px;font-size:11px;color:#d7eef0;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;pointer-events:none}#camPreview{position:fixed;right:10px;top:10px;width:100px;height:75px;object-fit:cover;border-radius:10px;border:1px solid #a9edf055;display:none;z-index:8}#fallback{position:fixed;left:10px;top:10px;z-index:9;display:none;gap:6px}#fallback button{padding:9px 11px;font-size:12px}#help{position:fixed;right:10px;bottom:10px;z-index:9;padding:8px 10px;font-size:11px;opacity:.75}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="welcome"><div class="card"><div class="logo">VXR</div><div class="sub">VISION XR · CASA IMERSIVA</div><button id="enter">ENTRAR NA CASA</button><p class="note">Use o celular na horizontal. Autorize o movimento e a câmera traseira quando solicitado. Para VR Box, ative o modo dividido no menu 3D.</p></div></div>
<video id="camPreview" autoplay playsinline muted></video>
<div id="fallback"><button id="menuBtn">Abrir menu 3D</button><button id="gyroBtn">Giroscópio</button><button id="handBtn">Ativar mãos</button></div>
<div id="help">Pinça: junte o polegar e o indicador para selecionar</div>
<div id="status">Preparando ambiente 3D…</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=s=>document.querySelector(s),status=$('#status'),canvas=$('#world');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.xr.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb9c9cc);scene.fog=new THREE.Fog(0xb9c9cc,18,42);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,100);camera.position.set(0,1.62,5.5);
scene.add(new THREE.HemisphereLight(0xe7f3ff,0x76604c,1.35));
const sun=new THREE.DirectionalLight(0xffe4bd,3.1);sun.position.set(-4,8,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;scene.add(sun);
const fill=new THREE.PointLight(0xffd6a5,18,12);fill.position.set(0,3.1,-2);scene.add(fill);
function mat(color,rough=.8,extra={}){return new THREE.MeshStandardMaterial({color,roughness:rough,...extra})}
function mesh(geo,m,x,y,z,parent=scene){const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function box(w,h,d,x,y,z,m,parent=scene){return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z,parent)}
function canvasTex(draw,repeatX=1,repeatY=1){const c=document.createElement('canvas');c.width=512;c.height=512;const g=c.getContext('2d');draw(g,c.width,c.height);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeatX,repeatY);t.colorSpace=THREE.SRGBColorSpace;return t}
const floorTex=canvasTex((g,w,h)=>{g.fillStyle='#927052';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=64){g.fillStyle=y%128?'#9b7958':'#886548';g.fillRect(0,y,w,62);for(let x=(y%128?0:128);x<w;x+=256){g.strokeStyle='#684b36';g.lineWidth=3;g.strokeRect(x,y,256,62)}for(let i=0;i<1800;i++){g.fillStyle='rgba(45,25,12,'+(Math.random()*.09)+')';g.fillRect(Math.random()*w,Math.random()*h,Math.random()*30+2,1)}},3,3);
const plasterTex=canvasTex((g,w,h)=>{g.fillStyle='#e5dfd3';g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){g.fillStyle='rgba(80,70,55,'+(Math.random()*.055)+')';g.fillRect(Math.random()*w,Math.random()*h,1.5,1.5)}});
const woodTex=canvasTex((g,w,h)=>{g.fillStyle='#98704d';g.fillRect(0,0,w,h);for(let i=0;i<90;i++){g.strokeStyle=i%3?'#805a3d':'#b08a60';g.globalAlpha=.3;g.lineWidth=Math.random()*3+1;g.beginPath();let y=Math.random()*h;g.moveTo(0,y);g.bezierCurveTo(160,y-15,330,y+15,w,y);g.stroke()}g.globalAlpha=1},1,1);
const floorMat=new THREE.MeshStandardMaterial({map:floorTex,roughness:.82}),wallMat=new THREE.MeshStandardMaterial({map:plasterTex,roughness:.94}),woodMat=new THREE.MeshStandardMaterial({map:woodTex,roughness:.65});
const white=mat(0xf0ece4),trim=mat(0xfaf7ef),charcoal=mat(0x29343a),glass=new THREE.MeshPhysicalMaterial({color:0xa8d4df,roughness:.12,metalness:.05,transparent:true,opacity:.36});
const floor=mesh(new THREE.PlaneGeometry(16,16),floorMat,0,0,0);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;
// Sala retangular com teto e paredes
box(12,.18,12,0,3.65,-.5,white);box(12,3.7,.18,0,1.85,-6.5,wallMat);box(.18,3.7,12,-6,1.85,-.5,wallMat);box(.18,3.7,12,6,1.85,-.5,wallMat);
box(12,.16,.18,0,.08,5.5,trim);box(.18,.16,12,-5.5,.08,-.5,trim);
for(let i=0;i<3;i++){const x=-3.5+i*3.5;box(2.55,2.05,.06,x,2.25,-6.38,glass);box(.09,2.12,.12,x-1.28,2.25,-6.3,charcoal);box(.09,2.12,.12,x+1.28,2.25,-6.3,charcoal);box(2.6,.09,.12,x,1.2,-6.3,charcoal);box(2.6,.09,.12,x,3.3,-6.3,charcoal);box(.07,2.1,.14,x,2.25,-6.25,trim)}
// cortinas discretas
const curtain=mat(0xc8c0b4);for(const x of [-4.95,4.95]){const c=box(.28,2.65,.16,x,2.1,-6.22,curtain);}
// tapete
const rug=box(4.8,.035,3.1,0,.025,-1.6,mat(0xb9b4a8));rug.receiveShadow=true;box(4.45,.012,2.8,0,.05,-1.6,mat(0xd3cfc5));
// sofá realçado em módulos
const sofaBase=mat(0x566b70),sofaSeat=mat(0x71868a),pillow=mat(0xb9a58c);
box(3.7,.42,.95,0,.48,-3.45,sofaBase);box(3.7,1.05,.34,0,1.12,-3.92,sofaBase);for(const x of [-1.35,0,1.35]){box(1.18,.2,.78,x,.78,-3.42,sofaSeat);box(.8,.62,.16,x,1.25,-3.68,pillow)}
for(const x of [-1.95,1.95])box(.28,.72,1,x,.78,-3.45,sofaBase);
// mesa de centro com tampo e pernas
for(const x of [-.85,.85])for(const z of [-.2,.2])box(.09,.42,.09,x,.27,-1.1+z,woodMat);
box(2,.13,1.15,0,.52,-1.1,woodMat);
// rack e televisão na parede lateral direita
box(2.8,.48,.48,4.95,.38,-2.4,woodMat);box(2.4,1.45,.12,4.95,1.55,-2.42,mat(0x101820,.22,{metalness:.35}));box(2.25,1.3,.025,4.95,1.55,-2.33,mat(0x243b4a,.18,{emissive:0x101e27,emissiveIntensity:.35}));
// luminária e plantas detalhadas
const brass=mat(0x9b8054,.35);box(.07,1.8,.07,-4.7,.9,-2.6,brass);mesh(new THREE.ConeGeometry(.38,.45,24),mat(0xd8c6a4),-4.7,1.95,-2.6);
function plant(x,z){mesh(new THREE.CylinderGeometry(.22,.28,.48,24),mat(0x98765a),x,.24,z);for(let i=0;i<9;i++){const a=i*Math.PI*2/9;const leaf=mesh(new THREE.ConeGeometry(.12,.95,12),mat(i%2?0x356a4a:0x477b55),x+Math.cos(a)*.18,.85,z+Math.sin(a)*.18);leaf.rotation.z=Math.cos(a)*.25;leaf.rotation.x=Math.sin(a)*.25}}plant(-4.8,-4.8);plant(4.8,-4.7);
// luzes de teto
const lamp=mesh(new THREE.CylinderGeometry(.32,.42,.12,32),mat(0xf4e5c5),0,3.48,-1.5);const point=new THREE.PointLight(0xffe3bf,26,10);point.position.set(0,3.15,-1.5);scene.add(point);
// menu espacial 3D
const menu=new THREE.Group();scene.add(menu);let menuPlaced=false;const hitTargets=[];const raycaster=new THREE.Raycaster();const handRay=new THREE.Vector2();let stereo=false,ipd=.064;
function labelTexture(text){const c=document.createElement('canvas');c.width=512;c.height=160;const g=c.getContext('2d');g.clearRect(0,0,512,160);g.fillStyle='#f4fbff';g.font='bold 42px Arial';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,82);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function menuButton(text,x,y,action){const group=new THREE.Group();group.position.set(x,y,0);const plate=mesh(new THREE.BoxGeometry(1.32,.58,.09),mat(0x20394a,.3,{metalness:.15}),0,0,0,group);plate.userData.action=action;plate.userData.target=true;hitTargets.push(plate);const tx=mesh(new THREE.PlaneGeometry(1.1,.34),new THREE.MeshBasicMaterial({map:labelTexture(text),transparent:true,depthWrite:false}),0,0,.052,group);tx.raycast=()=>{};menu.add(group);return plate}
const panel=mesh(new THREE.BoxGeometry(4.55,2.05,.16),mat(0x0c1b28,.3,{metalness:.15}),0,0,0,menu);panel.material.transparent=true;panel.material.opacity=.94;
const title=mesh(new THREE.PlaneGeometry(3.8,.38),new THREE.MeshBasicMaterial({map:labelTexture('VXR  ·  MENU ESPACIAL'),transparent:true}),0,.72,.095,menu);title.raycast=()=>{};
menuButton('CASA',-1.48,.05,()=>toast('Você já está na casa'));menuButton('VR BOX',0,.05,()=>toggleStereo());menuButton('GIROSCÓPIO',1.48,.05,()=>toggleGyro());menuButton('RASTREAR MÃOS',-1.48,-.68,()=>startHands());menuButton('RECENTRALIZAR',0,-.68,()=>recenter());menuButton('SAIR DO MENU',1.48,-.68,()=>{menu.visible=false;toast('Menu ocultado · abra pelo botão MENU')});
function placeMenu(){const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);menu.position.copy(camera.position).add(dir.multiplyScalar(2.35));menu.position.y-=.05;menu.quaternion.copy(camera.quaternion);menu.scale.setScalar(.82);menuPlaced=true}
function toast(t){status.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>status.textContent='Pinça: junte polegar e indicador para selecionar',3200)}
function toggleStereo(){stereo=!stereo;toast(stereo?'Modo VR Box dividido ativado':'Modo VR Box desativado')}
function toggleGyro(){gyroEnabled?stopGyro():startGyro()}
function recenter(){baseQuat.copy(deviceQuat);targetQuat.identity();camera.quaternion.identity();toast('Visão recentralizada')}
function onMenuAction(obj){if(!obj?.userData?.action)return;obj.material.emissive=new THREE.Color(0x245e68);obj.userData.action()}
const leftCam=new THREE.PerspectiveCamera(72,1,.05,100),rightCam=new THREE.PerspectiveCamera(72,1,.05,100);
function render(){if(renderer.xr.isPresenting){renderer.render(scene,camera);return}if(stereo){const w=Math.floor(innerWidth/2),h=innerHeight;leftCam.position.copy(camera.position);rightCam.position.copy(camera.position);leftCam.quaternion.copy(camera.quaternion);rightCam.quaternion.copy(camera.quaternion);leftCam.translateX(-ipd/2);rightCam.translateX(ipd/2);leftCam.aspect=w/h;rightCam.aspect=w/h;leftCam.updateProjectionMatrix();rightCam.updateProjectionMatrix();renderer.setScissorTest(true);renderer.setViewport(0,0,w,h);renderer.setScissor(0,0,w,h);renderer.render(scene,leftCam);renderer.setViewport(w,0,w,h);renderer.setScissor(w,0,w,h);renderer.render(scene,rightCam);renderer.setScissorTest(false)}else renderer.render(scene,camera)}
renderer.setAnimationLoop(render);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
// giroscópio com compensação de orientação da tela e suavização por quaternion
let gyroEnabled=false,baseQuat=new THREE.Quaternion(),targetQuat=new THREE.Quaternion(),deviceQuat=new THREE.Quaternion(),screenAngle=0;
const zee=new THREE.Vector3(0,0,1),euler=new THREE.Euler(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
function orientation(e){if(!gyroEnabled||e.alpha===null)return;const alpha=THREE.MathUtils.degToRad(e.alpha||0),beta=THREE.MathUtils.degToRad(e.beta||0),gamma=THREE.MathUtils.degToRad(e.gamma||0);euler.set(beta,alpha,-gamma,'YXZ');deviceQuat.setFromEuler(euler);deviceQuat.multiply(q1);screenAngle=THREE.MathUtils.degToRad(screen.orientation?.angle||0);deviceQuat.multiply(new THREE.Quaternion().setFromAxisAngle(zee,-screenAngle));targetQuat.copy(deviceQuat).multiply(baseQuat.clone().invert())}
function gyroTick(){if(gyroEnabled)camera.quaternion.slerp(targetQuat,.12)}
async function startGyro(){try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('Permissão do giroscópio negada')}addEventListener('deviceorientation',orientation,true);gyroEnabled=true;baseQuat.copy(deviceQuat);targetQuat.identity();toast('Giroscópio ativo · movimento suavizado')}catch(e){toast('Não foi possível ativar o giroscópio: '+e.message)}}
function stopGyro(){gyroEnabled=false;removeEventListener('deviceorientation',orientation,true);toast('Giroscópio pausado')}
function animate(){requestAnimationFrame(animate);gyroTick();}animate();
// hand tracking via MediaPipe Tasks Vision: câmera traseira obrigatória e pinça com raycast 3D
let handStream=null,handLandmarker=null,handActive=false,lastVideoTime=-1,pinchWasDown=false,lastPinchAt=0,handLoopId=0;
async function startHands(){if(handActive)return;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Câmera indisponível; abra o site por HTTPS no Chrome.');handStream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'environment'},width:{ideal:1280},height:{ideal:720}}});const video=$('#camPreview');video.srcObject=handStream;await video.play();video.style.display='block';toast('Carregando modelo de rastreamento de mãos…');const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14');const fileset=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');const options={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.55,minHandPresenceConfidence:.55,minTrackingConfidence:.55};try{handLandmarker=await vision.HandLandmarker.createFromOptions(fileset,{...options,baseOptions:{...options.baseOptions,delegate:'GPU'}})}catch(gpuError){handLandmarker=await vision.HandLandmarker.createFromOptions(fileset,{...options,baseOptions:{...options.baseOptions,delegate:'CPU'}})}handActive=true;toast('Mãos ativas · faça pinça para selecionar');$('#handBtn').textContent='Mãos ativas';trackHands()}catch(e){if(handStream)handStream.getTracks().forEach(t=>t.stop());handStream=null;toast('Falha no rastreamento: '+e.message+' · verifique permissão da câmera traseira.');console.error(e)}}
function trackHands(){if(!handActive)return;const video=$('#camPreview');if(video.readyState>=2&&video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;const result=handLandmarker.detectForVideo(video,performance.now());const landmarks=result.landmarks?.[0];if(landmarks){const thumb=landmarks[4],index=landmarks[8];const distance=Math.hypot(thumb.x-index.x,thumb.y-index.y);const pinching=distance<.055;const x=1-index.x,y=index.y;handRay.set(x*2-1,1-y*2);raycaster.setFromCamera(handRay,camera);const hits=raycaster.intersectObjects(hitTargets,false);if(hits.length){hits[0].object.material.emissive=new THREE.Color(pinching?0x277b82:0x12313b);if(pinching&&!pinchWasDown&&performance.now()-lastPinchAt>500){lastPinchAt=performance.now();onMenuAction(hits[0].object)}}if(pinching&&!pinchWasDown)toast('Pinça detectada');pinchWasDown=pinching}else{pinchWasDown=false}}handLoopId=requestAnimationFrame(trackHands)}
$('#menuBtn').onclick=()=>{menu.visible=true;placeMenu();toast('Menu 3D reposicionado à sua frente')};$('#gyroBtn').onclick=()=>toggleGyro();$('#handBtn').onclick=()=>startHands();
$('#enter').onclick=async()=>{$('#welcome').style.display='none';$('#fallback').style.display='flex';placeMenu();try{await startGyro()}catch(e){};toast('Bem-vindo ao VXR · menu flutuante à sua frente')};
addEventListener('beforeunload',()=>{if(handStream)handStream.getTracks().forEach(t=>t.stop())});
</script>
</body></html>
